{{ define "main" }}
  <!-- Section with Background Image -->
  {{ $image := .Params.image | default "/images/default-background.jpg" }}
  <section class="relative section-sm" style="background-image: url('{{ $image }}'); background-size: cover; background-position: center; background-repeat: no-repeat; height: 300px;">
    <!-- Dark Overlay -->
    <div class="absolute inset-0 bg-black opacity-50"></div>

    <div class="container h-full flex items-center justify-center relative z-10">
      <h1 class="text-4xl font-bold text-white p-6">
        {{ .Title }}
      </h1>
    </div>
  </section>

  <!-- Main Content Section -->
  <section class="section-sm">
    <div class="container">
      <div class="content mb-8">
        {{ .Content }}
      </div>

      <!-- List of Pages in the Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        {{ range .Pages }}
          <div class="committee-card p-4 rounded-md shadow-md bg-white">
            <!-- Image Section -->
            {{ $pageImage := .Params.image | default "/images/default-committee.jpg" }}
            <img src="{{ $pageImage }}" alt="{{ .Title }}" class="mb-4 w-full h-48 object-cover rounded-md shadow-md">

            <!-- Title Section -->
            <h2 class="text-3xl font-semibold mb-4 text-center">
              <a href="{{ .RelPermalink }}" 
                 style="
                   display: inline-block;
                   padding: 0.5rem 1rem;
                   font-size: 1.25rem; /* Larger font size */
                   font-weight: 600; /* Slightly bolder text */
                   color: black; /* Default text color */
                   background-color: white; /* Default background color */
                   border: 2px solid black; /* Border */
                   border-radius: 0.375rem; /* Rounded corners */
                   text-align: center; /* Center the text */
                   text-decoration: none;
                   transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; /* Smooth transition */
                 "
                 onmouseover="this.style.color='white'; this.style.backgroundColor='black'; this.style.borderColor='white';"
                 onmouseout="this.style.color='black'; this.style.backgroundColor='white'; this.style.borderColor='black';">
                {{ .Title }}
              </a>
            </h2>
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
