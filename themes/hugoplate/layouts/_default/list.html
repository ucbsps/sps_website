{{ define "main" }}


  <!-- Main Content Section -->
  <section class="section-sm">
    <div class="container">
      <div class="content mb-8">
        {{ .Content }}
      </div>

      <!-- List of Pages in the Section -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        {{ range .Pages }}
          <div class="committee-card p-4 rounded-md shadow-md bg-white">
            <!-- Image Section -->
            {{ $pageImage := .Params.image | default "/images/default-committee.jpg" }}
            <img src="{{ $pageImage }}" alt="{{ .Title }}" class="mb-4 w-full h-48 object-cover rounded-md shadow-md">

            <!-- Title Section -->
            <h2 class="text-2xl font-semibold mb-2">
              <a href="{{ .Permalink }}" class="text-blue-500 hover:text-blue-600">
                {{ .Title }}
              </a>
            </h2>
          </div>
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
